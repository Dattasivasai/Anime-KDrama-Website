```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Maxifi Login and Registration</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="wrapper">

        <img
            src="img.png"
            alt="Login illustration"
        >

        <h2 class="text-right">Welcome</h2>

        <!-- Login Form -->
        <div class="form-wrapper login">

            <form id="login-form">

                <h2>Login</h2>

                <div class="input-box">

                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span>

                    <input
                        id="login-email"
                        type="email"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="input-box">

                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>

                    <input
                        id="login-password"
                        type="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    >

                </div>

                <div class="forgot-pass">

                    <a
                        href="#"
                        id="forgot-password"
                    >
                        Forgot Password?
                    </a>

                </div>

                <button type="submit">
                    Login
                </button>

                <div class="sign-link">

                    <p>
                        Don't have an account?

                        <a
                            href="#"
                            onclick="registerActive(); return false;"
                        >
                            Register
                        </a>
                    </p>

                </div>

            </form>

        </div>

        <!-- Registration Form -->
        <div class="form-wrapper register">

            <form id="register-form">

                <h2>Registration</h2>

                <div class="input-box">

                    <span class="icon">
                        <ion-icon name="person"></ion-icon>
                    </span>

                    <input
                        id="register-name"
                        type="text"
                        placeholder="Full Name"
                        autocomplete="name"
                        required
                    >

                </div>

                <div class="input-box">

                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span>

                    <input
                        id="register-email"
                        type="email"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="input-box">

                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>

                    <input
                        id="register-password"
                        type="password"
                        placeholder="Password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <button type="submit">
                    Register
                </button>

                <div class="sign-link">

                    <p>
                        Already have an account?

                        <a
                            href="#"
                            onclick="loginActive(); return false;"
                        >
                            Login
                        </a>
                    </p>

                </div>

            </form>

        </div>

    </div>

    <script
        type="module"
        src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>

    <script
        nomodule
        src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>

    <script src="script.js"></script>

</body>

</html>
```
